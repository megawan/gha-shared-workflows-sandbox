name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  node:
    permissions:
      contents: read
    uses: megawan/gha-shared-workflows/.github/workflows/ci-node.yml@v1
  python:
    permissions:
      contents: read
    uses: megawan/gha-shared-workflows/.github/workflows/ci-python.yml@v1
  go:
    permissions:
      contents: read
    uses: megawan/gha-shared-workflows/.github/workflows/ci-go.yml@v1
  docker:
    permissions:
      contents: read
      packages: write
    uses: megawan/gha-shared-workflows/.github/workflows/ci-docker-build-push.yml@v1
    with:
      push: false
