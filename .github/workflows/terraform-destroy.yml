name: Terraform Destroy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'destroy' to confirm"
        required: true
permissions: {}
jobs:
  destroy:
    permissions:
      contents: read
      id-token: write
    uses: megawan/gha-shared-workflows/.github/workflows/terraform-destroy.yml@v1
    with:
      working-directory: terraform
      confirmation: ${{ inputs.confirmation }}
      environment: sandbox
